name: Rust Port (Tauri)

# Baut, testet und veröffentlicht den Rust-Port unter rust/.
#
# Releases erscheinen als Pre-Release mit dem Tag `rust-v<version>`
# (Version aus rust/Cargo.toml). Der Python-Updater ignoriert dieses Tag,
# Python-Nutzer werden also nicht automatisch umgestellt.

on:
  push:
    branches:
      - main
    paths:
      - "rust/**"
      - "app/i18n/locales/**"
      - "assets/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rust/**"
      - "app/i18n/locales/**"
      - "assets/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint und Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Linux-Abhängigkeiten
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  prepare:
    name: Release vorbereiten
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Version aus rust/Cargo.toml lesen
        id: version
        run: |
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=rust-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Rust-Version: ${VERSION}"

      - name: Entwurf anlegen (falls noch kein Release existiert)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | \"\(.id) \(.draft)\"" | head -n1)"
          if [[ -n "$EXISTING" && "${EXISTING#* }" == "false" ]]; then
            echo "Release ${TAG} ist bereits veröffentlicht – kein neuer Build."
            echo "release_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$EXISTING" ]]; then
            RELEASE_ID="${EXISTING%% *}"
            echo "Vorhandenen Entwurf ${RELEASE_ID} wiederverwenden."
          else
            # Die ID direkt aus der Antwort nehmen: Die Release-Liste enthält
            # einen gerade angelegten Entwurf nicht immer sofort.
            RELEASE_ID="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Genshin Mod Manager ${VERSION} (Rust, Vorschau)" \
              -F body=@RELEASE_NOTES.md \
              -F draft=true \
              -F prerelease=true \
              --jq .id)"
            echo "Entwurf ${RELEASE_ID} angelegt."
          fi
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Release-ID konnte nicht ermittelt werden."
            exit 1
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.release_id != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            os: ubuntu-22.04
            args: --bundles appimage
          - name: Windows Installer
            os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - run: npm ci

      - name: Signatur prüfen
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$KEY" ]]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – Release ohne Update-Pakete (latest.json)."
            echo 'args=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_OUTPUT"
          fi

      - name: Bauen und hochladen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: rust
          tauriScript: npx tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Release veröffentlichen
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Entwurf veröffentlichen
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
