name: Rust Port (Tauri)

# Baut und testet den Rust-Port unter rust/. Veröffentlicht KEIN Release:
# Ausgeliefert wird weiterhin die Python-Version, bis der Port vollständig ist.

on:
  push:
    branches:
      - main
    paths:
      - "rust/**"
      - "app/i18n/locales/**"
      - "assets/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rust/**"
      - "app/i18n/locales/**"
      - "assets/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint und Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Linux-Abhängigkeiten
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            os: ubuntu-22.04
            bundles: appimage
          - name: Windows NSIS
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - run: npm ci

      - name: Tauri-Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Ohne Signatur-Schlüssel keine Updater-Pakete (latest.json/.sig) erzeugen.
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: gmm-rust-${{ runner.os }}
          path: |
            rust/target/release/bundle/appimage/*.AppImage
            rust/target/release/bundle/appimage/*.sig
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 14
