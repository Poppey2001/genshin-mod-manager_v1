name: Build and Publish GMM Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and replace assets even if the APP_VERSION release already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  version:
    name: Read app/version.py
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from app/version.py
        id: version
        shell: bash
        run: |
          VERSION="$(
            python3 - <<'PY'
          from pathlib import Path
          import ast

          path = Path("app/version.py")
          tree = ast.parse(
              path.read_text(encoding="utf-8"),
              filename=str(path),
          )

          for node in tree.body:
              value = None

              if isinstance(node, ast.Assign):
                  if any(
                      isinstance(target, ast.Name)
                      and target.id == "APP_VERSION"
                      for target in node.targets
                  ):
                      value = node.value

              elif isinstance(node, ast.AnnAssign):
                  if (
                      isinstance(node.target, ast.Name)
                      and node.target.id == "APP_VERSION"
                  ):
                      value = node.value

              if (
                  isinstance(value, ast.Constant)
                  and isinstance(value.value, str)
              ):
                  version = value.value.strip().lstrip("vV")
                  print(version)
                  raise SystemExit(0)

          raise SystemExit(
              "APP_VERSION not found in app/version.py"
          )
          PY
          )"

          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Version source: app/version.py"
          echo "APP_VERSION=${VERSION}"
          echo "Release tag=${TAG}"

      - name: Check whether release already exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "Force rebuild requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "No new release is built until APP_VERSION changes."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet."
            echo "Building Windows + Linux artifacts."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    needs:
      - version

    if: needs.version.outputs.should_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build AppImage
        shell: bash
        run: |
          bash scripts/build_linux_appimage.sh \
            "${{ needs.version.outputs.version }}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          if-no-files-found: error

  windows:
    name: Windows Installer
    runs-on: windows-latest
    needs:
      - version

    if: needs.version.outputs.should_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build Windows EXE and installer
        shell: pwsh
        run: |
          .\scripts\build_windows_installer.ps1 `
            -Version "${{ needs.version.outputs.version }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*Setup*.exe
            release/*Setup*.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - version
      - linux
      - windows

    if: |
      always() &&
      needs.version.outputs.should_build == 'true' &&
      needs.linux.result == 'success' &&
      needs.windows.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release or update existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"

          RELEASE_FLAGS=()

          if [[ "$VERSION" =~ (a|b|rc|alpha|beta|pre) ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create \
              "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Genshin Mod Manager $VERSION" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi

          gh release upload \
            "$TAG" \
            release-assets/* \
            --clobber

          echo "Published release: $TAG"
