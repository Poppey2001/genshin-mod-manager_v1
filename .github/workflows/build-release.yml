name: Build Linux AppImage and Windows Installer

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.8b1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        shell: bash
        run: |
          bash scripts/build_linux_appimage.sh \
            "${{ steps.version.outputs.version }}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          if-no-files-found: error

  windows:
    name: Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $Tag = "${{ inputs.tag }}"
          }
          else {
              $Tag = "${env:GITHUB_REF_NAME}"
          }

          $Version = $Tag.TrimStart("v")

          "tag=$Tag" >> $env:GITHUB_OUTPUT
          "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          .\scripts\build_windows_installer.ps1 `
            -Version "${{ steps.version.outputs.version }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*Setup*.exe
            release/*Setup*.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          RELEASE_FLAGS=()

          if [[ "$VERSION" =~ (a|b|rc|alpha|beta|pre) ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create \
              "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Genshin Mod Manager $VERSION" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi

          gh release upload \
            "$TAG" \
            release-assets/* \
            --clobber
