name: Validate, Build and Publish GMM

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and replace release assets even when this APP_VERSION already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gmm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Translation and Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate translations
        shell: bash
        run: |
          python3 tools/check_translations.py

      - name: Validate Python syntax
        shell: bash
        run: |
          python3 -m compileall -q app

          if [[ -f "main.py" ]]; then
            python3 -m py_compile main.py
          fi

      - name: Validate build scripts exist
        shell: bash
        run: |
          test -f scripts/build_linux_appimage.sh
          test -f scripts/build_windows_installer.ps1
          test -f packaging/GenshinModManager.spec
          test -f packaging/linux/AppRun
          test -f packaging/linux/genshin-mod-manager.desktop
          test -f packaging/windows/installer.iss

  prepare:
    name: Resolve APP_VERSION
    runs-on: ubuntu-latest
    needs:
      - validate

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.mode.outputs.should_build }}
      should_release: ${{ steps.mode.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve version from app/version.py
        id: version
        shell: bash
        run: |
          VERSION="$(
            python3 - <<'PY'
          from pathlib import Path
          import ast

          path = Path("app/version.py")

          tree = ast.parse(
              path.read_text(
                  encoding="utf-8"
              ),
              filename=str(path),
          )

          for node in tree.body:
              value = None

              if isinstance(
                  node,
                  ast.Assign,
              ):
                  if any(
                      isinstance(
                          target,
                          ast.Name,
                      )
                      and target.id
                      == "APP_VERSION"
                      for target
                      in node.targets
                  ):
                      value = node.value

              elif isinstance(
                  node,
                  ast.AnnAssign,
              ):
                  if (
                      isinstance(
                          node.target,
                          ast.Name,
                      )
                      and node.target.id
                      == "APP_VERSION"
                  ):
                      value = node.value

              if (
                  isinstance(
                      value,
                      ast.Constant,
                  )
                  and isinstance(
                      value.value,
                      str,
                  )
              ):
                  version = (
                      value.value
                      .strip()
                      .lstrip("vV")
                  )

                  if version:
                      print(version)
                      raise SystemExit(0)

          raise SystemExit(
              "APP_VERSION not found in app/version.py"
          )
          PY
          )"

          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Version source: app/version.py"
          echo "APP_VERSION=${VERSION}"
          echo "Release tag=${TAG}"

      - name: Decide build and release mode
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Pull request: build both platforms for validation, but do not publish a release."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "Manual force rebuild requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Translations were validated, but no duplicate release build is needed."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist."
            echo "Windows and Linux will now be built."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    needs:
      - validate
      - prepare

    if: needs.prepare.outputs.should_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Build Linux AppImage
        shell: bash
        run: |
          bash scripts/build_linux_appimage.sh \
            "${{ needs.prepare.outputs.version }}"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ needs.prepare.outputs.version }}
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Installer
    runs-on: windows-latest
    needs:
      - validate
      - prepare

    if: needs.prepare.outputs.should_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Build Windows EXE and installer
        shell: pwsh
        run: |
          .\scripts\build_windows_installer.ps1 `
            -Version "${{ needs.prepare.outputs.version }}"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ needs.prepare.outputs.version }}
          path: |
            release/*Setup*.exe
            release/*Setup*.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs:
      - validate
      - prepare
      - linux
      - windows

    if: |
      always() &&
      needs.prepare.outputs.should_release == 'true' &&
      needs.linux.result == 'success' &&
      needs.windows.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux and Windows artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_FLAGS=()

          if [[ "$VERSION" =~ (a|b|rc|alpha|beta|pre) ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create \
              "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Genshin Mod Manager $VERSION" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi

          gh release upload \
            "$TAG" \
            release-assets/* \
            --clobber

          echo "Published release: $TAG"
