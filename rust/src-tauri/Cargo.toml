[package]
name = "genshin-mod-manager"
description = "Genshin Mod Manager (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "genshin-mod-manager"

[lib]
name = "gmm_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gmm-core = { path = "../crates/gmm-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-updater = "2.14"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.8"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
